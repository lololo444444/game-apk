name: Build APK Python
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential ccache
          sudo apt install -y libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android Licenses
        run: |
          # Скачиваем консольные инструменты Android и принимаем лицензии автоматически
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          mkdir -p ~/android-sdk/cmdline-tools
          unzip -q commandlinetools-linux-9477386_latest.zip -d ~/android-sdk/cmdline-tools
          mv ~/android-sdk/cmdline-tools/cmdline-tools ~/android-sdk/cmdline-tools/latest
          export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
          # Автоматически отвечаем "y" на все вопросы о лицензиях
          yes | sdkmanager --licenses

      - name: Create buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Stones
          package.name = stones
          package.domain = com.x
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy,plyer
          orientation = portrait
          fullscreen = 1
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stones-apk
          path: bin/*.apk

name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip && chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz -d /tmp/t
          mv /tmp/t/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/
          
      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
          -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" \
          -validity 9999 -deststoretype pkcs12
          
      - name: Export APK
        run: |
          # 1. Добавляем обязательную настройку текстур для Android в project.godot
          if ! grep -q "import_etc2_astc" project.godot; then
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi

          # 2. Создаем полноценный export_presets.cfg со всеми нужными полями
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          [preset.0.options]
          architectures/arm64-v8a=true
          package/unique_name="com.x.stones"
          package/name="Stones"
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/game.apk

      - uses: actions/upload-artifact@v4
        with: { name: apk, path: build/game.apk }
